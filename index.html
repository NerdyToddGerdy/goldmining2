<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gold Prospecting</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #1d2419; overflow: hidden; overscroll-behavior: none; }
      /* Touch: no double-tap zoom, text selection, or long-press callouts over the game. */
      body { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      /* Keep controls clear of notches and rounded corners. */
      :root {
        --edge-l: max(12px, env(safe-area-inset-left));
        --edge-r: max(12px, env(safe-area-inset-right));
        --edge-b: max(12px, env(safe-area-inset-bottom));
        --edge-t: max(10px, env(safe-area-inset-top));
      }
      #game { position: fixed; inset: 0; }
      #start {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(20, 26, 18, 0.85); color: #efe6cf; cursor: pointer; z-index: 10;
        font: 600 22px/1.4 Georgia, serif; letter-spacing: 0.02em; user-select: none;
      }
      .hud { position: fixed; inset: 0; pointer-events: none; color: #efe6cf; font: 14px/1.4 system-ui, sans-serif; }
      .hud button, .hud input { pointer-events: auto; }
      .hud button {
        background: rgba(20, 26, 18, 0.7); color: #efe6cf; border: 1px solid rgba(239, 230, 207, 0.45);
        border-radius: 4px; padding: 8px 12px; font: inherit; cursor: pointer; touch-action: none; user-select: none;
      }
      @media (hover: hover) { .hud button:hover { background: rgba(60, 70, 50, 0.85); } }
      .hud button:active { background: rgba(80, 90, 60, 0.9); }
      .hud-hint { position: absolute; left: var(--edge-l); top: var(--edge-t); right: 140px; opacity: 0.8; text-shadow: 0 1px 2px #000; }
      .hud-cash {
        position: absolute; right: var(--edge-r); top: var(--edge-t); font: 600 18px Georgia, serif;
        color: #f3d77a; text-shadow: 0 1px 3px #000;
      }
      .hud-result {
        position: absolute; left: 50%; top: 18%; transform: translateX(-50%);
        font: 600 22px Georgia, serif; text-shadow: 0 2px 4px #000; text-align: center; white-space: pre-line;
      }
      .hud-result.hud-result-town {
        top: 66%; font-size: 17px; line-height: 1.5; padding: 10px 16px; border-radius: 4px;
        background: rgba(30, 20, 12, 0.75); text-shadow: none; max-width: min(560px, 90vw);
      }
      .hud-panel {
        position: absolute; right: var(--edge-r); top: 44px; width: min(340px, calc(100vw - 24px)); max-height: calc(100vh - 130px); overflow-y: auto;
        background: rgba(30, 22, 14, 0.9); border: 1px solid rgba(239, 230, 207, 0.25); border-radius: 4px;
        padding: 10px 12px; pointer-events: auto; font-size: 13px;
      }
      .hud-panel h3 { margin: 0 0 8px; font: 600 17px Georgia, serif; color: #f3d77a; cursor: pointer; }
      .hud-panel h3::after { content: ' ▾'; font-size: 13px; opacity: 0.7; }
      .hud-panel h3 .count { font: 12px system-ui, sans-serif; opacity: 0.75; margin-left: 6px; }
      .hud-panel.collapsed { width: auto; }
      .hud-panel.collapsed h3 { margin: 0; }
      .hud-panel.collapsed h3::after { content: ' ▸'; }
      .hud-panel.collapsed > :not(h3):not(.tabs) { display: none; }
      .hud-panel .tabs { display: flex; gap: 4px; margin: -2px 0 8px; border-bottom: 1px solid rgba(239, 230, 207, 0.2); }
      .hud-panel.collapsed .tabs { margin-bottom: 0; border-bottom: none; }
      .hud-panel .tabs button {
        background: none; border: none; border-bottom: 2px solid transparent; border-radius: 0;
        padding: 4px 8px 6px; min-height: 0; font: 600 15px Georgia, serif; color: rgba(239, 230, 207, 0.65);
      }
      .hud-panel .tabs button.active { color: #f3d77a; border-bottom-color: #f3d77a; }
      .hud-panel .tab-body > .lead:first-child { border-top: none; padding-top: 2px; }
      .hud-panel .tabs .count { font: 12px system-ui, sans-serif; margin-left: 5px; opacity: 0.75; }
      .hud-panel p { margin: 2px 0 6px; }
      .hud-panel .small { font-size: 12px; opacity: 0.75; }
      .hud-panel .lead { border-top: 1px solid rgba(239, 230, 207, 0.15); padding: 8px 0; }
      .hud-panel .lead.dud { opacity: 0.5; }
      .hud-panel .found { color: #9fd08a; }
      .hud-panel button[disabled] { opacity: 0.4; cursor: default; }
      .hud-toast {
        position: absolute; left: 50%; top: 28%; transform: translateX(-50%);
        background: rgba(20, 26, 18, 0.85); padding: 8px 14px; border-radius: 4px; color: #f3d77a;
      }
      .hud-inspect {
        position: absolute; left: var(--edge-l); top: 48px; min-width: 210px; padding: 8px 10px;
        background: rgba(12, 16, 11, 0.8); border-radius: 4px; font-size: 13px;
      }
      .hud-inspect div { display: flex; justify-content: space-between; gap: 16px; }
      .hud-inspect b { font-weight: 600; }
      .hud-bar {
        position: absolute; left: var(--edge-l); right: 120px; bottom: var(--edge-b);
        display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      }
      .hud-pan-controls { display: flex; gap: 8px; align-items: center; }
      .hud-pan-controls[hidden] { display: none; }
      .hud-water[hidden] { display: none; }
      .hud-tilt { display: flex; align-items: center; gap: 6px; text-shadow: 0 1px 2px #000; }
      .hud-tilt input { width: 120px; }
      .hud-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      #fullscreen {
        position: fixed; right: var(--edge-r); bottom: var(--edge-b); padding: 6px 10px;
        background: rgba(0, 0, 0, 0.35); color: #efe6cf; border: 1px solid rgba(239, 230, 207, 0.4);
        border-radius: 4px; font: 13px system-ui, sans-serif; cursor: pointer;
      }
      /* Touch: a slider and buttons big enough for a thumb. */
      @media (pointer: coarse) {
        .hud-tilt input { width: 170px; height: 32px; }
        .hud button { min-height: 40px; }
      }
      /* Short screens (phones held sideways): smaller type, two-line hints, tighter bars. */
      @media (max-height: 500px) {
        .hud { font-size: 13px; }
        .hud-hint { font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .hud button { padding: 5px 10px; min-height: 34px; }
        .hud-bar { gap: 6px; }
        .hud-result { top: 14%; font-size: 17px; }
        .hud-result.hud-result-town { top: 46%; font-size: 14px; padding: 6px 12px; }
        .hud-toast { top: 22%; font-size: 13px; max-width: 70vw; }
        .hud-inspect { top: 40px; font-size: 12px; }
        #fullscreen { padding: 4px 8px; font-size: 12px; }
      }
      /* Phones held upright: the game is laid out landscape, so ask for a turn. */
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 20; flex-direction: column; gap: 18px;
        align-items: center; justify-content: center; padding: 24px; text-align: center;
        background: #1d2419; color: #efe6cf; font: 600 20px/1.4 Georgia, serif;
      }
      #rotate svg { width: 72px; height: 72px; animation: turn 2.4s ease-in-out infinite; }
      @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (max-width: 599px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <!-- Browsers block audio until a user gesture, so play starts from a click. -->
    <div id="start">Click to start at the creek</div>
    <button id="fullscreen" type="button">Fullscreen</button>
    <div id="rotate" role="alert">
      <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="14" y="4" width="20" height="40" rx="4" fill="none" stroke="#e6b940" stroke-width="3" /><circle cx="24" cy="38" r="2" fill="#e6b940" /></svg>
      Turn your phone sideways to play.
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
